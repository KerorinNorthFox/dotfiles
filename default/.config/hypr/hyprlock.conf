general {
  disable_loading_bar = true
  hide_cursor = true
  grace = 0
}

animations {
  enabled = true
  bezier = easeOutQuint, 0.23, 1, 0.32, 1
  animation = fadeIn, 1, 4, easeOutInQuint
  animation = fadeOut, 1, 4, easeOutQuint
}

background {
  monitor =
  path = screenshot
  # TODO: ロック画面用のwallpaperを~/Wallpapersに配置し、パスを指定するようにする.
  blur_passes = 3
  blur_size = 8
  noise = 0.0117
  contrast = 0.8916
  brightness = 0.8172
  vabrancy = 0.1696
  vibrancy_darkness = 0.0
}

image {
  monitor =
  path = ~/avatar.png
  size = 90
  rounding = -1
  border_size = 2
  
  border_color = rgba(255, 255, 255, 0.3)
  
  position = -210, 0
  halign = center
  valign = center
}

label {
  monitor =
  text = $USER
  
  color = rgba(242, 243, 244, 0.9)
  font_size = 18
  font_family = Sans
  
  position = -65, 30
  halign = center
  halign = center
  text_align = left
}

input-field {
  monitor =
  size = 260, 48
  outline_thickness = 2
  dos_size = 0.25
  dots_spacing = 0.3
  dots_center = true
  dots_rounding = -1
  fade_on_empty = false
  
  font_color = rgb(200, 200, 200)
  inner_color = rgba(0, 0, 0, 0.5)
  outer_color = rgba(255, 255, 255, 0.2)
  check_color = rgba(204, 136, 34, 0)
  fail_color = rgba(204, 34, 34, 0)
  
  position = 0, -30
  halign = center
  valign = center
}

